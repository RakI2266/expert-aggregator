<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Expert Letters — Аналитика</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/styles.css">
  <link rel="stylesheet" href="../css/analytics.css">
</head>
<body style="display:flex">
  <aside class="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-logo">
        <div class="sidebar-logo-icon">
          <svg viewBox="0 0 24 24"><path d="M12 3L2 8l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
        </div>
        <div class="sidebar-logo-text">
          <h1>Expert Letters</h1>
          <span>Личный кабинет юриста</span>
        </div>
      </div>
    </div>
    <nav class="sidebar-nav">
      <a href="dashboard.html" class="nav-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="20" height="14" rx="2" ry="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></svg>
        <span>Мои заявки</span>
      </a>
      <a href="create.html" class="nav-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="12" y1="18" x2="12" y2="12"/><line x1="9" y1="15" x2="15" y2="15"/></svg>
        <span>Создать заявку</span>
      </a>
      <a href="analytics.html" class="nav-item active" aria-current="page">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M7 14l4-4 4 4 5-6"/></svg>
        <span>Аналитика</span>
      </a>
      <a href="settings.html" class="nav-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
        <span>Настройки</span>
      </a>
    </nav>
    <div class="sidebar-footer">
      <div class="user-info">
        <div class="user-avatar" id="userAvatar">-</div>
        <div class="user-details">
          <div class="name" id="userName">-</div>
          <div class="role">Юрист</div>
        </div>
      </div>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <h2>Аналитика</h2>
      <div class="topbar-actions">
        <button type="button" class="btn btn-secondary" id="logoutBtn">Выйти</button>
      </div>
    </header>
    <div class="content">
      <p class="an-lead anim-fade">Сводка по вашим заявкам и ответам экспертов. Данные демо — из браузера.</p>
      <div class="kpi-grid" id="kpiGrid"></div>
      <div class="an-grid">
        <div class="card an-card anim-card">
          <div class="card-header"><h3>Заявки и ответы по неделям</h3></div>
          <div class="card-body an-chart-wrap">
            <div id="lineChart" class="line-chart"></div>
            <div class="chart-legend">
              <span><i style="background:#2563EB"></i> Заявки</span>
              <span><i style="background:#10B981"></i> Ответы</span>
            </div>
          </div>
        </div>
        <div class="card an-card anim-card" style="--d:80ms">
          <div class="card-header"><h3>Статусы</h3></div>
          <div class="card-body">
            <div id="barChart" class="bar-chart"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="../js/app.js"></script>
  <script src="../js/analytics.js"></script>
  <script>
  (function () {
    var state = requireAuth('lawyer');
    if (!state) return;
    var user = state.currentUser;
    var $ = function (id) { return document.getElementById(id); };
    $('userName').textContent = user.name || '-';
    $('userAvatar').textContent = (user.name || '-').split(/\s+/).map(function (w) { return w[0]; }).slice(0, 2).join('');
    $('logoutBtn').addEventListener('click', logout);

    var stats = ELAnalytics.lawyerStats(user.id);
    $('kpiGrid').innerHTML = stats.kpis.map(function (k, i) {
      return '<div class="kpi anim-card" style="--d:' + (i * 60) + 'ms"><div class="kpi-val">' + k.value + '</div><div class="kpi-label">' + k.label + '</div></div>';
    }).join('');
    ELAnalytics.renderLineChart($('lineChart'), stats.byWeek, ['created', 'answers'], ['#2563EB', '#10B981']);
    ELAnalytics.renderBarChart($('barChart'), stats.statusBars);
  })();
  </script>
</body>
</html>
