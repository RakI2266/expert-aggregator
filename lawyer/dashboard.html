<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Expert Letters - Мои заявки</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/styles.css">
  <style>
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
    .case-cell { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; }
    .case-cell .chat-row-badge { margin-left: 0; }
    .dash-search { flex: 1 1 240px; min-width: 0; }
    .dash-search .input { width: 100%; min-width: 0; }
    .dash-meta { font-size: 13px; color: var(--text-muted); margin: -8px 0 12px; }
    .th-sort { background: none; border: 0; padding: 0; font: inherit; color: inherit; text-transform: inherit; letter-spacing: inherit; cursor: pointer; display: inline-flex; align-items: center; gap: 4px; }
    .th-sort .sort-ind { opacity: .7; }
    .sub-muted { display: block; font-size: 12px; color: var(--text-muted); font-weight: 500; }
    @media (max-width: 720px) {
      .filters .filter-group { flex: 1 1 100%; }
      .filters .select-wrapper select { width: 100%; }
    }
  </style>
</head>
<body style="display:flex">
  <aside class="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-logo">
        <div class="sidebar-logo-icon">
          <svg viewBox="0 0 24 24"><path d="M12 3L2 8l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
        </div>
        <div class="sidebar-logo-text">
          <h1>Expert Letters</h1>
          <span>Личный кабинет юриста</span>
        </div>
      </div>
    </div>
    <nav class="sidebar-nav">
      <a href="dashboard.html" class="nav-item active" aria-current="page">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="20" height="14" rx="2" ry="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></svg>
        <span>Мои заявки</span>
      </a>
      <a href="create.html" class="nav-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="12" y1="18" x2="12" y2="12"/><line x1="9" y1="15" x2="15" y2="15"/></svg>
        <span>Создать заявку</span>
      </a>
            <a href="analytics.html" class="nav-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M7 14l4-4 4 4 5-6"/></svg>
        <span>Аналитика</span>
      </a>
<a href="settings.html" class="nav-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
        <span>Настройки</span>
      </a>
    </nav>
    <div class="sidebar-footer">
      <div class="user-info">
        <div class="user-avatar" id="userAvatar">-</div>
        <div class="user-details">
          <div class="name" id="userName">-</div>
          <div class="role">Юрист</div>
        </div>
      </div>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <h2>Мои заявки</h2>
      <div class="topbar-actions">
        <a href="create.html" class="btn btn-primary">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="12" y1="18" x2="12" y2="12"/><line x1="9" y1="15" x2="15" y2="15"/></svg>
          Создать заявку
        </a>
        <button type="button" class="btn btn-secondary" id="logoutBtn">Выйти</button>
      </div>
    </header>

    <div class="content">
      <div class="plan-banner" id="planBanner"></div>
      <div class="filters" role="search">
        <div class="filter-group">
          <label for="statusFilter">Статус</label>
          <div class="select-wrapper">
            <select id="statusFilter">
              <option value="all">Все</option>
              <option value="accepting">Приём предложений</option>
              <option value="expired">Срок истёк</option>
              <option value="closed">Закрыта</option>
            </select>
          </div>
        </div>
        <div class="filter-group dash-search">
          <label for="searchInput">Поиск</label>
          <input type="search" class="input" id="searchInput" placeholder="Номер дела или суд" autocomplete="off">
        </div>
      </div>
      <div class="dash-meta" id="dashMeta" aria-live="polite"></div>

      <div class="table-card">
        <table class="table-responsive" id="requestsTable">
          <thead>
            <tr>
              <th scope="col">Номер дела</th>
              <th scope="col">Суд</th>
              <th scope="col">Статус</th>
              <th scope="col">Ответов</th>
              <th scope="col" data-sort-col="acceptUntil" aria-sort="none"><button type="button" class="th-sort" data-sort="acceptUntil">Приём до <span class="sort-ind" aria-hidden="true">↕</span></button></th>
              <th scope="col">Заседание</th>
              <th scope="col" data-sort-col="publishedAt" aria-sort="descending"><button type="button" class="th-sort" data-sort="publishedAt">Опубликована <span class="sort-ind" aria-hidden="true">↓</span></button></th>
              <th scope="col"><span class="sr-only">Действия</span></th>
            </tr>
          </thead>
          <tbody id="requestsBody"></tbody>
        </table>
        <div class="empty-state" id="emptyState" style="display:none"></div>
      </div>
    </div>
  </div>

  <script src="../js/app.js"></script>
  <script>
  (function () {
    const state = requireAuth('lawyer');
    if (!state) return;
    const user = state.currentUser;
    const userName = user.name || '-';
    document.getElementById('userName').textContent = userName;
    document.getElementById('userAvatar').textContent = userName.split(/\s+/).filter(Boolean).map(w => w[0]).slice(0, 2).join('') || '-';
    document.getElementById('logoutBtn').addEventListener('click', logout);

    function renderPlanBanner() {
      const info = getLawyerPlan(user);
      const el = document.getElementById('planBanner');
      const limitText = info.limit == null
        ? 'Безлимит заявок'
        : ('Осталось ' + info.remaining + ' из ' + info.limit + ' заявок');
      const warn = info.expired || (info.remaining !== null && info.remaining <= 1);
      el.className = 'plan-banner' + (warn ? ' plan-banner-warn' : '');
      el.innerHTML =
        '<div class="plan-banner-main">' +
          '<div class="plan-name">' + esc(info.plan.name) + '</div>' +
          '<div class="plan-meta">' + esc(limitText) + '</div>' +
          '<div class="plan-meta">До окончания: ' + (info.expired ? 'истёк' : esc(info.daysLeft) + ' дн.') + '</div>' +
        '</div>' +
        '<a href="settings.html#plan" class="btn btn-secondary btn-sm">Выбрать тариф</a>';
    }
    renderPlanBanner();

    const STATUS_KEY = 'el_lawyer_dash_filter';
    let sortKey = 'publishedAt';
    let sortDir = -1;
    const statusSel = document.getElementById('statusFilter');
    const searchInp = document.getElementById('searchInput');
    try {
      const saved = JSON.parse(sessionStorage.getItem(STATUS_KEY) || 'null');
      if (saved) {
        if (['all', 'accepting', 'expired', 'closed'].includes(saved.status)) statusSel.value = saved.status;
        if (typeof saved.q === 'string') searchInp.value = saved.q;
        if (['publishedAt', 'acceptUntil'].includes(saved.sortKey)) { sortKey = saved.sortKey; sortDir = saved.sortDir === 1 ? 1 : -1; }
      }
    } catch (e) {}

    function persist() {
      try { sessionStorage.setItem(STATUS_KEY, JSON.stringify({ status: statusSel.value, q: searchInp.value, sortKey, sortDir })); } catch (e) {}
    }

    function updateSortHeaders() {
      document.querySelectorAll('#requestsTable th[data-sort-col]').forEach(th => {
        const k = th.getAttribute('data-sort-col');
        const active = k === sortKey;
        th.setAttribute('aria-sort', active ? (sortDir > 0 ? 'ascending' : 'descending') : 'none');
        th.querySelector('.sort-ind').textContent = active ? (sortDir > 0 ? '↑' : '↓') : '↕';
      });
    }

    function renderTable() {
      const filter = statusSel.value;
      const q = searchInp.value.trim().toLowerCase();
      const all = getRequestsForLawyer(user.id);
      let list = all.slice();
      if (filter !== 'all') list = list.filter(r => effectiveStatus(r) === filter);
      if (q) list = list.filter(r => String(r.caseNumber || '').toLowerCase().includes(q) || String(r.court || '').toLowerCase().includes(q));
      list.sort((a, b) => {
        if (sortKey === 'acceptUntil') return String(a.acceptUntil || '').localeCompare(String(b.acceptUntil || '')) * sortDir;
        return (new Date(a.publishedAt) - new Date(b.publishedAt)) * sortDir;
      });
      updateSortHeaders();
      persist();

      const tbody = document.getElementById('requestsBody');
      const empty = document.getElementById('emptyState');
      const table = document.getElementById('requestsTable');
      const meta = document.getElementById('dashMeta');
      meta.textContent = all.length ? ('Показано: ' + list.length + ' из ' + all.length) : '';

      if (!list.length) {
        tbody.innerHTML = '';
        table.style.display = 'none';
        empty.style.display = 'block';
        if (!all.length) {
          empty.innerHTML =
            '<div class="empty-state-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" aria-hidden="true"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></svg></div>' +
            '<h3>Заявок пока нет</h3><p>Создайте первую заявку и получите предложения экспертов.</p>' +
            '<a href="create.html" class="btn btn-primary btn-sm">Создать заявку</a>';
        } else {
          empty.innerHTML = '<h3>Ничего не найдено</h3><p>Измените фильтр статуса или поисковый запрос.</p>' +
            '<button type="button" class="btn btn-secondary btn-sm" id="resetFilters">Сбросить фильтры</button>';
          document.getElementById('resetFilters').addEventListener('click', () => {
            statusSel.value = 'all'; searchInp.value = ''; renderTable(); searchInp.focus();
          });
        }
        return;
      }
      table.style.display = '';
      empty.style.display = 'none';

      tbody.innerHTML = list.map(r => {
        const st = effectiveStatus(r);
        const href = 'request.html?id=' + encodeURIComponent(r.id);
        const left = st === 'accepting' ? '<span class="sub-muted">' + esc(daysLeft(r.acceptUntil)) + '</span>' : '';
        const activeCount = countActiveAnswers(r);
        const newCount = (r.answers || []).filter(a => !a.withdrawn && a.status === 'sent').length;
        const chatUnread = getUnreadChatCountForRequest(r.id);
        const newBadge = newCount ? '<span class="badge badge-new" title="Непросмотренные ответы">+' + newCount + ' ' + (newCount === 1 ? 'новый' : 'новых') + '</span>' : '';
        const chatBadge = chatUnread
          ? '<span class="chat-row-badge" title="Новые сообщения в чате" aria-label="Непрочитанных сообщений: ' + chatUnread + '">✉ ' + chatUnread + '</span>'
          : '';
        return '<tr class="clickable-row" data-href="' + esc(href) + '">' +
          '<td data-label="Номер дела"><div class="case-cell"><a class="case-number" href="' + esc(href) + '">' + esc(r.caseNumber) + '</a>' + newBadge + chatBadge + '</div></td>' +
          '<td data-label="Суд">' + esc(r.court) + '</td>' +
          '<td data-label="Статус">' + appStatusBadge(r) + '</td>' +
          '<td data-label="Ответов">' + answersCountBadge(activeCount) + '</td>' +
          '<td data-label="Приём до">' + esc(formatDate(r.acceptUntil)) + left + '</td>' +
          '<td data-label="Заседание">' + esc(formatHearing(r.hearingDate, r.hearingTime)) + '</td>' +
          '<td data-label="Опубликована">' + esc(formatDate(r.publishedAt)) + '</td>' +
          '<td data-label=""><a href="' + esc(href) + '" class="btn-open">Открыть</a></td>' +
        '</tr>';
      }).join('');
    }

    document.getElementById('requestsBody').addEventListener('click', e => {
      if (e.target.closest('a,button')) return;
      const tr = e.target.closest('tr[data-href]');
      if (tr) location.href = tr.getAttribute('data-href');
    });
    document.querySelectorAll('#requestsTable .th-sort').forEach(btn => {
      btn.addEventListener('click', () => {
        const k = btn.getAttribute('data-sort');
        if (sortKey === k) sortDir *= -1;
        else { sortKey = k; sortDir = k === 'acceptUntil' ? 1 : -1; }
        renderTable();
      });
    });
    statusSel.addEventListener('change', renderTable);
    searchInp.addEventListener('input', renderTable);

    renderTable();
    mountNotificationBell();
  })();
  </script>
</body>
</html>
